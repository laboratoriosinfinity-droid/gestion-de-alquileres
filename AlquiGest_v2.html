<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN — REEMPLAZÁ ESTOS VALORES CON LOS TUYOS
// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
  CLIENT_ID: '306802428190-2trbo3t0gf8uil59a48hb2a98o4dgfr2.apps.googleusercontent.com',        // Pegá aquí tu Google Client ID
  SCOPES: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file',
  FILE_NAME: 'alquigest_datos.json',
  // Para compartir: todos los que usen el mismo CLIENT_ID y el mismo archivo comparten datos
};

const {useState,useEffect,useCallback,useRef}=React;
const h=React.createElement;

const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const NOW=new Date();
const fmt=(n)=>n==null?'—':'$'+Math.round(n).toLocaleString('es-AR');
const mesKey=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
const mesLabel=(y,m)=>MESES[m]+' '+y;
const uid=()=>Math.random().toString(36).slice(2,9);

function generarMeses(fechaInicio){
  const inicio=new Date(fechaInicio+'T00:00:00');
  const meses=[];
  const start=new Date(NOW.getFullYear(),4,1);
  const end=new Date(NOW.getFullYear()+1,NOW.getMonth()+1,1);
  let cur=new Date(Math.max(inicio.getTime(),start.getTime()));
  cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  while(cur<=end){
    meses.push({year:cur.getFullYear(),month:cur.getMonth(),key:mesKey(cur.getFullYear(),cur.getMonth())});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return meses;
}

function calcularMonto(alquiler,year,month,variables){
  const contrato=alquiler.contrato;
  const varMes=variables[mesKey(year,month)]||{};
  if(contrato.tipo==='fijo'){
    return aplicarAjuste(contrato.montoBase,contrato.ajuste,varMes);
  }
  if(contrato.tipo==='escalonado'){
    const inicio=new Date(alquiler.fechaInicio+'T00:00:00');
    const mesRelativo=(year-inicio.getFullYear())*12+(month-inicio.getMonth())+1;
    const tramo=contrato.tramos.find(t=>mesRelativo>=t.mesDesde&&mesRelativo<=t.mesHasta);
    if(!tramo)return null;
    return aplicarAjuste(tramo.montoBase,tramo.ajuste,varMes);
  }
  return null;
}

function aplicarAjuste(base,ajuste,varMes){
  if(!ajuste||ajuste==='ninguno')return base;
  if(ajuste==='dolar'){const v=varMes.dolar;return v?base*v:base}
  if(ajuste==='nafta'){const v=varMes.nafta;return v?base*v:base}
  if(ajuste==='ipc'){const v=varMes.ipc;return v?base*(1+v/100):base}
  return base;
}

function estadoPago(alqId,mk,pagos,montoEsperado){
  const pago=pagos[`${alqId}_${mk}`];
  if(!pago)return{estado:'pendiente',pagado:0,esperado:montoEsperado,diferencia:-(montoEsperado||0)};
  const diff=pago.monto-(montoEsperado||0);
  const estado=diff>=0?'pagado':(pago.monto>0?'parcial':'pendiente');
  return{estado,pagado:pago.monto,esperado:montoEsperado,diferencia:diff,fecha:pago.fecha};
}

// ═══════════════════════════════════════════════════════════════════
// GOOGLE DRIVE SERVICE
// ═══════════════════════════════════════════════════════════════════
class DriveService {
  constructor(){this.token=null;this.fileId=null}

  hasClientId(){return !!CONFIG.CLIENT_ID && CONFIG.CLIENT_ID.length > 10}

  async signIn(){
    return new Promise((resolve,reject)=>{
      if(!window.google){reject(new Error('Google no cargó'));return}
      const client=window.google.accounts.oauth2.initTokenClient({
        client_id:CONFIG.CLIENT_ID,
        scope:CONFIG.SCOPES,
        callback:(resp)=>{
          if(resp.error){reject(new Error(resp.error));return}
          this.token=resp.access_token;
          resolve(resp);
        }
      });
      client.requestAccessToken();
    });
  }

  signOut(){this.token=null;this.fileId=null}

  async findFile(){
    const r=await fetch(
      `https://www.googleapis.com/drive/v3/files?q=name='${CONFIG.FILE_NAME}'+and+trashed=false&spaces=drive&fields=files(id,name,modifiedTime)`,
      {headers:{Authorization:`Bearer ${this.token}`}}
    );
    const data=await r.json();
    if(data.files&&data.files.length>0){this.fileId=data.files[0].id;return data.files[0]}
    return null;
  }

  async load(){
    const file=await this.findFile();
    if(!file)return null;
    const r=await fetch(
      `https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`,
      {headers:{Authorization:`Bearer ${this.token}`}}
    );
    const text=await r.text();
    try{return JSON.parse(text)}catch{return null}
  }

  async save(data){
    const body=JSON.stringify(data);
    const meta=JSON.stringify({name:CONFIG.FILE_NAME,mimeType:'application/json'});
    if(this.fileId){
      await fetch(
        `https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=multipart`,
        {method:'PATCH',headers:{Authorization:`Bearer ${this.token}`,'Content-Type':`multipart/related; boundary=bound`},
         body:`--bound\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--bound\r\nContent-Type: application/json\r\n\r\n${body}\r\n--bound--`}
      );
    } else {
      const r=await fetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
        {method:'POST',headers:{Authorization:`Bearer ${this.token}`,'Content-Type':`multipart/related; boundary=bound`},
         body:`--bound\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--bound\r\nContent-Type: application/json\r\n\r\n${body}\r\n--bound--`}
      );
      const d=await r.json();
      this.fileId=d.id;
    }
    return true;
  }

  async makeShared(){
    if(!this.fileId)return;
    await fetch(
      `https://www.googleapis.com/drive/v3/files/${this.fileId}/permissions`,
      {method:'POST',headers:{Authorization:`Bearer ${this.token}`,'Content-Type':'application/json'},
       body:JSON.stringify({role:'writer',type:'anyone'})}
    );
    const r=await fetch(
      `https://www.googleapis.com/drive/v3/files/${this.fileId}?fields=webViewLink,id`,
      {headers:{Authorization:`Bearer ${this.token}`}}
    );
    return await r.json();
  }
}
const drive=new DriveService();

// ═══════════════════════════════════════════════════════════════════
// STORE con Drive sync
// ═══════════════════════════════════════════════════════════════════
function useStore(){
  const[alquileres,setAlquileres]=useState(()=>{try{return JSON.parse(localStorage.getItem('alq_alquileres')||'[]')}catch{return[]}});
  const[pagos,setPagos]=useState(()=>{try{return JSON.parse(localStorage.getItem('alq_pagos')||'{}')}catch{return{}}});
  const[variables,setVariables]=useState(()=>{try{return JSON.parse(localStorage.getItem('alq_variables')||'{}')}catch{return{}}});
  const[driveUser,setDriveUser]=useState(null);
  const[syncStatus,setSyncStatus]=useState('off'); // off | loading | ok | error
  const[lastSync,setLastSync]=useState(null);
  const[driveFileId,setDriveFileId]=useState(null);
  const pendingSync=useRef(null);

  const localSave=(a,p,v)=>{
    localStorage.setItem('alq_alquileres',JSON.stringify(a));
    localStorage.setItem('alq_pagos',JSON.stringify(p));
    localStorage.setItem('alq_variables',JSON.stringify(v));
  };

  const pushToDrive=useCallback(async(a,p,v)=>{
    if(!drive.token)return;
    setSyncStatus('loading');
    try{
      await drive.save({alquileres:a,pagos:p,variables:v,ts:Date.now()});
      setSyncStatus('ok');setLastSync(new Date());
    }catch{setSyncStatus('error')}
  },[]);

  const schedulePush=useCallback((a,p,v)=>{
    clearTimeout(pendingSync.current);
    pendingSync.current=setTimeout(()=>pushToDrive(a,p,v),2000);
  },[pushToDrive]);

  const applyRemote=(data)=>{
    if(!data)return;
    setAlquileres(data.alquileres||[]);setPagos(data.pagos||{});setVariables(data.variables||{});
    localSave(data.alquileres||[],data.pagos||{},data.variables||{});
  };

  const signIn=async()=>{
    setSyncStatus('loading');
    try{
      await drive.signIn();
      // Get user info
      const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:`Bearer ${drive.token}`}});
      const u=await r.json();
      setDriveUser(u);
      // Load from Drive (Drive wins over local)
      const remote=await drive.load();
      if(remote&&remote.ts){
        const localTs=parseInt(localStorage.getItem('alq_ts')||'0');
        if(remote.ts>=localTs){applyRemote(remote)}
        else{await pushToDrive(alquileres,pagos,variables)}
      } else {
        // First time — push local data
        await pushToDrive(alquileres,pagos,variables);
      }
      if(drive.fileId)setDriveFileId(drive.fileId);
      setSyncStatus('ok');setLastSync(new Date());
    }catch(e){setSyncStatus('error');console.error(e)}
  };

  const signOut=()=>{drive.signOut();setDriveUser(null);setSyncStatus('off');setLastSync(null)};

  const pullFromDrive=async()=>{
    if(!drive.token)return;
    setSyncStatus('loading');
    try{
      const remote=await drive.load();
      applyRemote(remote);
      setSyncStatus('ok');setLastSync(new Date());
    }catch{setSyncStatus('error')}
  };

  // Data mutations
  const mut=(fn)=>{
    let na=alquileres,np=pagos,nv=variables;
    fn((a,p,v)=>{na=a;np=p;nv=v});
    setAlquileres(na);setPagos(np);setVariables(nv);
    localSave(na,np,nv);
    localStorage.setItem('alq_ts',Date.now().toString());
    schedulePush(na,np,nv);
  };

  const addAlquiler=(a)=>mut((set)=>set([...alquileres,{...a,id:uid()}],pagos,variables));
  const updateAlquiler=(id,a)=>mut((set)=>set(alquileres.map(x=>x.id===id?{...a,id}:x),pagos,variables));
  const deleteAlquiler=(id)=>{
    const newP={...pagos};Object.keys(newP).filter(k=>k.startsWith(id+'_')).forEach(k=>delete newP[k]);
    mut((set)=>set(alquileres.filter(x=>x.id!==id),newP,variables));
  };
  const registrarPago=(alqId,mk,monto,montoEsperado)=>{
    const k=`${alqId}_${mk}`;
    mut((set)=>set(alquileres,{...pagos,[k]:{monto:parseFloat(monto),montoEsperado,fecha:new Date().toISOString().slice(0,10)}},variables));
  };
  const deletePago=(alqId,mk)=>{
    const k=`${alqId}_${mk}`;const np={...pagos};delete np[k];
    mut((set)=>set(alquileres,np,variables));
  };
  const setVar=(mk,field,val)=>{
    mut((set)=>set(alquileres,pagos,{...variables,[mk]:{...(variables[mk]||{}),[field]:parseFloat(val)||0}}));
  };

  return{alquileres,pagos,variables,addAlquiler,updateAlquiler,deleteAlquiler,registrarPago,deletePago,setVar,
         driveUser,syncStatus,lastSync,driveFileId,signIn,signOut,pullFromDrive,drive};
}

function Badge({estado}){
  const map={pagado:['badge-paid','dot-paid','✓ Pagado'],parcial:['badge-partial','dot-partial','~ Parcial'],pendiente:['badge-pending','dot-pending','✗ Pendiente']};
  const[cls,dot,label]=map[estado]||map.pendiente;

}

function SyncBar({status,lastSync,user,onPull}){
  const msgs={off:'Sin sincronización',loading:'Sincronizando...',ok:'Sincronizado con Drive',error:'Error al sincronizar'};

  const fields=[{id:'dolar',label:'Dólar (ARS)',placeholder:'Ej: 1200'},{id:'nafta',label:'Litro nafta (ARS)',placeholder:'Ej: 950'},{id:'ipc',label:'IPC variación (%)',placeholder:'Ej: 4.5'}];
  return h('div',{className:'content'},
    h('p',{className:'section-title'},'Variables por mes'),
    h('div',{className:'alert alert-info'},'Cargá una vez por mes. Se aplican automáticamente a todos los contratos.'),
    meses.map(m=>{

  );
}

function TabReporte({alquileres,pagos,variables}){
  const[mes,setMes]=useState(mesKey(NOW.getFullYear(),NOW.getMonth()));
  const[year,month]=mes.split('-').map(Number);
  const mesObj={year,month:month-1};
  const rows=alquileres.map(a=>{const esp=calcularMonto(a,mesObj.year,mesObj.month,variables);const est=estadoPago(a.id,mes,pagos,esp);return{a,esp,est}});
  const totalEsp=rows.reduce((s,r)=>s+(r.esp||0),0);
  const totalPag=rows.reduce((s,r)=>s+r.est.pagado,0);
  const pagados=rows.filter(r=>r.est.estado==='pagado').length;
  const pendientes=rows.filter(r=>r.est.estado==='pendiente').length;
  const mesesDisp=[];
  for(let i=-3;i<=6;i++){const d=new Date(NOW.getFullYear(),NOW.getMonth()+i,1);mesesDisp.push({key:mesKey(d.getFullYear(),d.getMonth()),label:mesLabel(d.getFullYear(),d.getMonth())})}
  const exportar=()=>{
    const lines=['AlquiGest — Reporte','Mes: '+mesLabel(mesObj.year,mesObj.month),'','Propiedad | Inquilino | Esperado | Pagado | Estado'];
    rows.forEach(({a,esp,est})=>lines.push(`${a.propiedad} | ${a.inquilino} | ${fmt(esp)} | ${fmt(est.pagado)} | ${est.estado}`));
    lines.push('','TOTAL ESPERADO: '+fmt(totalEsp),'TOTAL COBRADO: '+fmt(totalPag),'DEUDA: '+fmt(totalEsp-totalPag));
    const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='reporte_alquileres.txt';a.click();
  };
  return h('div',{className:'content'},
    h('p',{className:'section-title'},'Reporte mensual'),
    h('div',{className:'form-group'},h('select',{className:'form-select',value:mes,onChange:(e)=>setMes(e.target.value)},mesesDisp.map(m=>h('option',{key:m.key,value:m.key},m.label)))),
    h('div',{className:'stats-row'},
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{color:'var(--green)'}},pagados),h('div',{className:'stat-label'},'Pagados')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{color:'var(--red)'}},pendientes),h('div',{className:'stat-label'},'Pendientes'))
    ),
    h('div',{className:'stats-row'},
      h('div',{className:'stat-box'},h('div',{className:'stat-num'},fmt(totalPag)),h('div',{className:'stat-label'},'Total cobrado')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{color:'var(--red)'}},fmt(totalEsp-totalPag)),h('div',{className:'stat-label'},'Deuda total'))
    ),
    rows.length===0&&h('div',{className:'empty'},h('div',{className:'empty-icon'},'📊'),h('div',{className:'empty-msg'},'Sin alquileres')),
    rows.map(({a,esp,est})=>h('div',{key:a.id,className:'card'},
      h('div',{className:'card-row'},h('div',null,h('div',{style:{fontWeight:700,fontSize:15}},a.propiedad),h('div',{style:{fontSize:13,color:'var(--text2)'}},a.inquilino)),h(Badge,{estado:est.estado})),
      h('div',{className:'card-row'},h('span',{style:{fontSize:13,color:'var(--text2)'}},'Esperado'),h('span',{style:{fontWeight:600}},fmt(esp))),
      h('div',{className:'card-row'},h('span',{style:{fontSize:13,color:'var(--text2)'}},'Pagado'),h('span',{style:{fontWeight:600,color:est.pagado>=(esp||0)?'var(--green)':'var(--red)'}},fmt(est.pagado))),
      est.diferencia<0&&h('div',{className:'card-row'},h('span',{style:{fontSize:13,color:'var(--text2)'}},'Debe'),h('span',{style:{fontWeight:700,color:'var(--red)'}},fmt(-est.diferencia)))
    )),
    alquileres.length>0&&h('button',{className:'btn-secondary',style:{marginTop:8},onClick:exportar},'⬇ Exportar reporte (.txt)')
  );
}

function TabDashboard({alquileres,pagos,variables,onEditAlquiler,onPagar,onHistorial}){
  const mesActualKey=mesKey(NOW.getFullYear(),NOW.getMonth());
  const rows=alquileres.map(a=>{const esp=calcularMonto(a,NOW.getFullYear(),NOW.getMonth(),variables);const est=estadoPago(a.id,mesActualKey,pagos,esp);return{a,esp,est}});
  const total=rows.reduce((s,r)=>s+(r.esp||0),0);
  const cobrado=rows.reduce((s,r)=>s+r.est.pagado,0);
  return h('div',{className:'content'},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}},
      h('div',null,h('p',{style:{fontSize:13,color:'var(--text2)'}},'Mes actual'),h('p',{style:{fontSize:18,fontWeight:800}},mesLabel(NOW.getFullYear(),NOW.getMonth()))),
      alquileres.length>0&&h('div',{style:{textAlign:'right'}},h('p',{style:{fontSize:12,color:'var(--text2)'}},'Cobrado / Esperado'),h('p',{style:{fontSize:15,fontWeight:700}},fmt(cobrado)+' / '+fmt(total)))
    ),
    alquileres.length===0&&h('div',{className:'empty'},h('div',{className:'empty-icon'},'🏠'),h('div',{className:'empty-msg'},'Sin alquileres'),h('div',{className:'empty-sub'},'Tocá + para agregar tu primer alquiler')),
    rows.map(({a,esp,est})=>h('div',{key:a.id,className:'prop-card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}},
        h('div',null,h('div',{className:'prop-name'},a.propiedad),h('div',{className:'prop-tenant'},a.inquilino)),
        h(Badge,{estado:est.estado})
      ),
      h('div',{style:{marginBottom:8}},
        h('span',{className:`tag tag-${a.contrato.tipo}`},a.contrato.tipo==='fijo'?'Fijo':'Escalonado'),
        a.contrato.ajuste&&a.contrato.ajuste!=='ninguno'&&h('span',{className:'tag tag-ajuste',style:{marginLeft:4}},a.contrato.ajuste)
      ),
      h('div',{className:'prop-amounts'},
        h('div',{className:'amount-box'},h('div',{className:'amount-label'},'Esperado'),h('div',{className:'amount-val'},esp==null?'—':fmt(esp))),
        h('div',{className:'amount-box'},h('div',{className:'amount-label'},'Pagado'),h('div',{className:`amount-val ${est.pagado===0?'red':est.pagado>=(esp||0)?'green':'yellow'}`},fmt(est.pagado))),
        h('div',{className:'amount-box'},h('div',{className:'amount-label'},'Diferencia'),h('div',{className:`amount-val ${est.diferencia>=0?'green':'red'}`},est.diferencia===0?'—':((est.diferencia>0?'+':'')+fmt(est.diferencia))))
      ),
      h('div',{className:'prop-actions'},
        h('button',{className:'btn-pay',onClick:()=>onPagar(a,{year:NOW.getFullYear(),month:NOW.getMonth(),key:mesActualKey},esp,pagos[`${a.id}_${mesActualKey}`])},est.estado==='pagado'?'✓ Pago registrado':'Registrar pago'),
        h('button',{className:'btn-hist',onClick:()=>onHistorial(a)},'📋'),
        h('button',{className:'btn-hist',onClick:()=>onEditAlquiler(a)},'✎')
      )
    ))
  );
}

// ── APP ROOT ───────────────────────────────────────────────────────
function App(){
  const store=useStore();
  const{alquileres,pagos,variables,addAlquiler,updateAlquiler,deleteAlquiler,registrarPago,deletePago,setVar,
        driveUser,syncStatus,lastSync,driveFileId,signIn,signOut,pullFromDrive}=store;
  const[tab,setTab]=useState('home');
  const[modal,setModal]=useState(null);
  const closeModal=()=>setModal(null);
  const TABS=[
    {id:'home',icon:'🏠',label:'Inicio'},
    {id:'vars',icon:'📈',label:'Variables'},
    {id:'report',icon:'📊',label:'Reporte'},
    {id:'drive',icon:'☁️',label:'Drive'},
  ];
  const initials=driveUser?(driveUser.name||driveUser.email||'?')[0].toUpperCase():null;

  return h('div',null,
    h('div',{className:'nav'},
      h('div',{className:'nav-title'},'AlquiGest'),
      driveUser&&h('button',{className:'nav-user',onClick:()=>setTab('drive'),title:driveUser.email},initials),
      !driveUser&&h('button',{className:'nav-sync',onClick:()=>setTab('drive')},'☁ Drive')
    ),
    h(SyncBar,{status:syncStatus,lastSync,user:driveUser,onPull:pullFromDrive}),
    h('div',{className:'tabs'},TABS.map(t=>h('button',{key:t.id,className:`tab ${tab===t.id?'active':''}`,onClick:()=>setTab(t.id)},h('span',{className:'tab-icon'},t.icon),t.label))),
    tab==='home'&&h(TabDashboard,{alquileres,pagos,variables,onEditAlquiler:(a)=>setModal({type:'form',data:a}),onPagar:(a,m,esp,pago)=>setModal({type:'pago',alquiler:a,mes:m,montoEsperado:esp,pagoActual:pago}),onHistorial:(a)=>setModal({type:'hist',alquiler:a})}),
    tab==='vars'&&h(TabVariables,{variables,setVar}),
    tab==='report'&&h(TabReporte,{alquileres,pagos,variables}),
    tab==='drive'&&h(TabDrive,{driveUser,syncStatus,lastSync,driveFileId,signIn,signOut,pullFromDrive,drive:store.drive}),
    tab==='home'&&h('button',{className:'fab',onClick:()=>setModal({type:'form',data:null})},'+'),
    modal?.type==='form'&&h(FormAlquiler,{initial:modal.data,onSave:(data)=>{modal.data?updateAlquiler(modal.data.id,data):addAlquiler(data)},onDelete:()=>deleteAlquiler(modal.data.id),onClose:closeModal}),
    modal?.type==='pago'&&h(ModalPago,{alquiler:modal.alquiler,mes:modal.mes,montoEsperado:modal.montoEsperado,pagoActual:modal.pagoActual,onClose:closeModal,onSave:(monto)=>registrarPago(modal.alquiler.id,modal.mes.key,monto,modal.montoEsperado),onDelete:()=>deletePago(modal.alquiler.id,modal.mes.key)}),
    modal?.type==='hist'&&h(Historial,{alquiler:modal.alquiler,pagos,variables,onClose:closeModal,onRegistrar:(m,esp,pago)=>setModal({type:'pago',alquiler:modal.alquiler,mes:m,montoEsperado:esp,pagoActual:pago})})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
